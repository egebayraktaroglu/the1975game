<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 1975 Song Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            min-height: 100vh;
            color: white;
        }
        
        .song-card {
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .song-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .song-card.selected {
            background: rgba(30, 215, 96, 0.2);
            border: 1px solid rgba(30, 215, 96, 0.5);
        }
        
        .song-card.eliminated {
            opacity: 0.5;
            filter: grayscale(80%);
            pointer-events: none;
        }
        
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
        
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1DB954 0%, #1ED760 100%);
            transition: width 0.5s ease;
        }
        
        .bracket-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 50%;
            animation: fall 5s linear forwards;
            z-index: 1000;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .eliminated-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        
        /* Bracket styles */
        .bracket {
            display: flex;
            overflow-x: auto;
            padding: 20px 0;
            margin-top: 40px;
        }
        
        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-width: 200px;
            margin-right: 20px;
        }
        
        .round-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            color: #1ED760;
        }
        
        .matchup {
            position: relative;
            margin: 10px 0;
            min-height: 60px;
        }
        
        .matchup::before {
            content: '';
            position: absolute;
            right: -20px;
            top: 50%;
            width: 20px;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
        }
        
        .matchup::after {
            content: '';
            position: absolute;
            right: -20px;
            top: 50%;
            width: 2px;
            height: 50%;
            background: rgba(255, 255, 255, 0.3);
        }
        
        .matchup:nth-child(even)::after {
            top: 0;
            height: 50%;
        }
        
        .matchup:last-child::after {
            display: none;
        }
        
        .team {
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .team:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .team.winner {
            background: rgba(30, 215, 96, 0.2);
            border-left: 3px solid #1ED760;
        }
        
        .team.eliminated {
            opacity: 0.5;
            text-decoration: line-through;
        }
        
        .final-matchup .team {
            background: rgba(30, 215, 96, 0.1);
        }
        
        .final-matchup .team.winner {
            background: rgba(30, 215, 96, 0.3);
            font-weight: bold;
        }
        
        .bracket-container {
            position: relative;
        }
        
        .bracket-highlight {
            position: absolute;
            background: rgba(30, 215, 96, 0.1);
            border-radius: 4px;
            transition: all 0.3s;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div class="container mx-auto px-4 py-8 flex-grow">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-6xl font-bold mb-4 glow-text">
                <span class="text-[#1ED760]">The 1975</span> Song Tournament
            </h1>
            <p class="text-lg text-gray-300 max-w-2xl mx-auto">
                Out of 64 of the best The 1975 songs, we'll determine the ultimate fan favorite. Vote in each matchup to advance songs to the next round!
            </p>
        </header>

        <!-- Game Area -->
        <div id="game-container" class="relative">
            <!-- Round Indicator -->
            <div class="flex justify-between items-center mb-8">
                <div class="flex-1">
                    <h2 id="round-title" class="text-2xl font-bold text-center">Round 1</h2>
                    <div class="progress-bar mt-2 rounded-full">
                        <div id="progress-fill" class="progress-fill rounded-full" style="width: 0%"></div>
                    </div>
                </div>
                <button id="shuffle-btn" class="bg-[#1ED760] hover:bg-[#1DB954] text-black font-bold py-2 px-4 rounded-full flex items-center ml-4 transition-all">
                    <i class="fas fa-random mr-2"></i> Shuffle
                </button>
            </div>

            <!-- Matchup Display -->
            <div id="matchup-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                <!-- Song cards will be inserted here by JavaScript -->
            </div>

            <!-- Next Round Button -->
            <div class="text-center">
                <button id="next-btn" class="bg-[#1ED760] hover:bg-[#1DB954] text-black font-bold py-3 px-8 rounded-full text-lg hidden transition-all transform hover:scale-105">
                    Next Matchup <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>

            <!-- Bracket Visualization -->
            <div class="mt-16">
                <h3 class="text-xl font-bold mb-4 text-center">Tournament Bracket</h3>
                <div id="bracket-container" class="bracket-container">
                    <div id="bracket" class="bracket"></div>
                    <div id="bracket-highlight" class="bracket-highlight"></div>
                </div>
            </div>
            
            <!-- Eliminated Songs -->
            <div id="eliminated-container" class="mt-12 hidden">
                <h3 class="text-xl font-bold mb-4 text-center">Eliminated This Round</h3>
                <div id="eliminated-songs" class="flex flex-wrap justify-center gap-2">
                    <!-- Eliminated songs will be added here -->
                </div>
            </div>
        </div>

        <!-- Winner Screen (hidden initially) -->
        <div id="winner-container" class="hidden text-center py-16">
            <div class="max-w-2xl mx-auto">
                <h2 class="text-3xl font-bold mb-4">And the winner is...</h2>
                <div id="winner-card" class="song-card rounded-xl p-6 mb-8 max-w-md mx-auto">
                    <!-- Winner song will be inserted here -->
                </div>
                <button id="restart-btn" class="bg-[#1ED760] hover:bg-[#1DB954] text-black font-bold py-3 px-8 rounded-full text-lg transition-all transform hover:scale-105">
                    Play Again <i class="fas fa-redo ml-2"></i>
                </button>
                
                <!-- Final Bracket -->
                <div class="mt-16">
                    <h3 class="text-xl font-bold mb-4">Final Tournament Bracket</h3>
                    <div id="final-bracket" class="bracket"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black bg-opacity-50 py-6 text-center text-gray-400">
        <p>Created with <i class="fas fa-heart text-red-500"></i> for The 1975 fans</p>
    </footer>

    <script>

        const songs = [

            { id: 48, title: "Don't Worry", album: "Notes On A Conditional Form", year: 2020 },
            { id: 49, title: "Medicine", album: "The 1975 (EP)", year: 2013 },
            { id: 50, title: "You", album: "The 1975 (EP)", year: 2013 },
            { id: 51, title: "Milk", album: "The 1975 (EP)", year: 2013 },
            { id: 52, title: "So Far (It's Alright)", album: "The 1975 (EP)", year: 2013 },
            { id: 53, title: "Head.Cars.Bending", album: "The 1975 (EP)", year: 2013 },
            { id: 54, title: "Me", album: "The 1975 (EP)", year: 2013 },
            { id: 55, title: "Anobrain", album: "The 1975 (EP)", year: 2013 },
            { id: 56, title: "Haunt // Bed", album: "The 1975 (EP)", year: 2013 },
            { id: 57, title: "Woman", album: "Sex EP", year: 2012 },
            { id: 58, title: "Intro/Set3", album: "Sex EP", year: 2012 },
            { id: 59, title: "Undo", album: "Sex EP", year: 2012 },
            { id: 60, title: "You", album: "Sex EP", year: 2012 },
            { id: 61, title: "Menswear", album: "Sex EP", year: 2020 },
            { id: 62, title: "Pressure", album: "Sex EP", year: 2012 },
            { id: 63, title: "So Far (It's Alright)", album: "Sex EP", year: 2012 },
            { id: 64, title: "An Encounter", album: "The 1975", year: 2013 }
        ];

        // Game state
        let currentRound = 1;
        let currentMatchup = 0;
        let remainingSongs = [...songs];
        let eliminatedSongs = [];
        let shuffled = false;
        let matchups = [];
        let winners = [];
        let usedSongsInRound = [];
        let bracketHistory = [];

        // DOM elements
        const matchupContainer = document.getElementById('matchup-container');
        const roundTitle = document.getElementById('round-title');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const progressFill = document.getElementById('progress-fill');
        const gameContainer = document.getElementById('game-container');
        const winnerContainer = document.getElementById('winner-container');
        const winnerCard = document.getElementById('winner-card');
        const restartBtn = document.getElementById('restart-btn');
        const bracket = document.getElementById('bracket');
        const bracketHighlight = document.getElementById('bracket-highlight');
        const eliminatedContainer = document.getElementById('eliminated-container');
        const eliminatedSongsEl = document.getElementById('eliminated-songs');
        const finalBracket = document.getElementById('final-bracket');

        // Initialize the game
        function initGame() {
            // Reset all game state
            currentRound = 1;
            currentMatchup = 0;
            remainingSongs = [...songs];
            eliminatedSongs = [];
            winners = [];
            usedSongsInRound = [];
            bracketHistory = [];
            
            // Shuffle the songs for the first round
            shuffleArray(remainingSongs);
            
            // Create matchups (pair songs)
            createMatchups();
            
            // Display the first matchup
            displayMatchup();
            
            // Update UI
            updateRoundTitle();
            updateProgress();
            updateEliminatedDisplay();
            updateBracket();
            
            // Hide eliminated container initially
            eliminatedContainer.classList.add('hidden');
        }

        // Create matchups for the current round
        function createMatchups() {
            matchups = [];
            usedSongsInRound = [];
            
            // Get available songs (not yet used in this round and not eliminated)
            const availableSongs = remainingSongs.filter(song => 
                !usedSongsInRound.includes(song.id) && 
                !eliminatedSongs.some(elim => elim.id === song.id)
            );
            
            // Shuffle available songs for this round
            shuffleArray(availableSongs);
            
            for (let i = 0; i < availableSongs.length; i += 2) {
                if (i + 1 < availableSongs.length) {
                    matchups.push({
                        song1: availableSongs[i],
                        song2: availableSongs[i + 1],
                        winner: null
                    });
                    usedSongsInRound.push(availableSongs[i].id);
                    usedSongsInRound.push(availableSongs[i + 1].id);
                } else {
                    // If odd number of songs, the last song gets a bye
                    matchups.push({
                        song1: availableSongs[i],
                        song2: null,
                        winner: availableSongs[i]
                    });
                    usedSongsInRound.push(availableSongs[i].id);
                }
            }
            
            currentMatchup = 0;
            
            // Save to bracket history
            bracketHistory.push({
                round: currentRound,
                matchups: [...matchups]
            });
        }

        // Display the current matchup
        function displayMatchup() {
            matchupContainer.innerHTML = '';
            
            const matchup = matchups[currentMatchup];
            
            if (!matchup) {
                // No more matchups in this round
                advanceRound();
                return;
            }
            
            // Display song 1
            if (matchup.song1) {
                const song1Card = createSongCard(matchup.song1, 'song1');
                matchupContainer.appendChild(song1Card);
            }
            
            // Display song 2
            if (matchup.song2) {
                const song2Card = createSongCard(matchup.song2, 'song2');
                matchupContainer.appendChild(song2Card);
            } else {
                // If only one song (bye), automatically advance it
                setTimeout(() => {
                    matchup.winner = matchup.song1;
                    nextMatchup();
                }, 1000);
            }
            
            // Show/hide next button
            nextBtn.classList.add('hidden');
            
            // Update bracket highlight
            updateBracketHighlight();
        }

        // Create a song card element
        function createSongCard(song, songId) {
            const card = document.createElement('div');
            card.className = 'song-card rounded-xl p-6 cursor-pointer transition-all relative';
            card.dataset.songId = song.id;
            card.dataset.matchupId = songId;
            
            // Check if song is eliminated
            const isEliminated = eliminatedSongs.some(s => s.id === song.id);
            if (isEliminated) {
                card.classList.add('eliminated');
                const eliminatedTag = document.createElement('div');
                eliminatedTag.className = 'eliminated-tag';
                eliminatedTag.textContent = 'ELIMINATED';
                card.appendChild(eliminatedTag);
            }
            
            card.innerHTML = `
                <h3 class="text-2xl font-bold mb-2">${song.title}</h3>
                <p class="text-gray-300 mb-1">${song.album}</p>
                <p class="text-gray-400">${song.year}</p>
                <div class="mt-4 text-right">
                    <span class="inline-block bg-black bg-opacity-50 px-3 py-1 rounded-full text-sm">
                        Vote
                    </span>
                </div>
            `;
            
            // Only add click handler if not eliminated
            if (!isEliminated) {
                card.addEventListener('click', () => selectWinner(song, songId));
            }
            
            return card;
        }

        // Handle song selection (voting)
        function selectWinner(song, songId) {
            const matchup = matchups[currentMatchup];
            matchup.winner = song;
            
            // Mark the loser as eliminated
            const loser = songId === 'song1' ? matchup.song2 : matchup.song1;
            if (loser && !eliminatedSongs.some(s => s.id === loser.id)) {
                eliminatedSongs.push(loser);
                updateEliminatedDisplay();
            }
            
            // Highlight selected song
            const cards = document.querySelectorAll('.song-card');
            cards.forEach(card => {
                card.classList.remove('selected');
                if (card.dataset.matchupId === songId) {
                    card.classList.add('selected');
                }
            });
            
            // Show next button
            nextBtn.classList.remove('hidden');
            
            // Update bracket
            updateBracket();
        }

        // Update the eliminated songs display
        function updateEliminatedDisplay() {
            eliminatedSongsEl.innerHTML = '';
            
            if (eliminatedSongs.length > 0) {
                eliminatedContainer.classList.remove('hidden');
                
                eliminatedSongs.forEach(song => {
                    const el = document.createElement('div');
                    el.className = 'bg-gray-800 px-3 py-1 rounded-full text-sm';
                    el.textContent = song.title;
                    eliminatedSongsEl.appendChild(el);
                });
            } else {
                eliminatedContainer.classList.add('hidden');
            }
        }

        // Move to the next matchup
        function nextMatchup() {
            // Add winner to next round
            if (matchups[currentMatchup].winner) {
                winners.push(matchups[currentMatchup].winner);
            }
            
            currentMatchup++;
            
            if (currentMatchup < matchups.length) {
                displayMatchup();
            } else {
                // End of round
                advanceRound();
            }
            
            updateProgress();
            updateBracket();
        }

        // Advance to the next round or end game
        function advanceRound() {
            if (winners.length === 1) {
                // We have a winner!
                showWinner(winners[0]);
                return;
            }
            
            currentRound++;
            remainingSongs = [...winners];
            winners = [];
            usedSongsInRound = [];
            eliminatedSongs = [];
            
            // Re-enable shuffle button
            shuffleBtn.disabled = false;
            shuffleBtn.classList.remove('opacity-50');
            
            // Create new matchups
            createMatchups();
            
            // Display first matchup of new round
            displayMatchup();
            
            // Update UI
            updateRoundTitle();
            updateProgress();
            updateEliminatedDisplay();
            updateBracket();
        }

        // Show the winner screen
        function showWinner(winner) {
            gameContainer.classList.add('hidden');
            winnerContainer.classList.remove('hidden');
            
            winnerCard.innerHTML = `
                <h3 class="text-3xl font-bold mb-2">${winner.title}</h3>
                <p class="text-gray-300 mb-1">From ${winner.album} (${winner.year})</p>
                <div class="mt-6">
                    <span class="inline-block bg-[#1ED760] text-black px-4 py-2 rounded-full font-bold">
                        Champion!
                    </span>
                </div>
            `;
            
            // Add celebration effects
            createConfetti();
            winnerCard.classList.add('pulse');
            
            // Show final bracket
            renderFinalBracket();
        }

        // Update the round title
        function updateRoundTitle() {
            let roundName;
            const remainingCount = remainingSongs.length;
            
            if (remainingCount >= 32) roundName = "Round of 64";
            else if (remainingCount >= 16) roundName = "Round of 32";
            else if (remainingCount >= 8) roundName = "Sweet 16";
            else if (remainingCount >= 4) roundName = "Elite 8";
            else if (remainingCount >= 2) roundName = "Final 4";
            else if (remainingCount === 1) roundName = "Championship";
            
            roundTitle.textContent = roundName || `Round ${currentRound}`;
        }

        // Update the progress bar
        function updateProgress() {
            const progress = (currentMatchup / matchups.length) * 100;
            progressFill.style.width = `${progress}%`;
        }

        // Shuffle the current matchup
        function shuffleMatchup() {
            if (shuffled) return;
            
            const matchup = matchups[currentMatchup];
            if (!matchup || !matchup.song2) return;
            
            // Swap songs
            const temp = matchup.song1;
            matchup.song1 = matchup.song2;
            matchup.song2 = temp;
            
            // Redisplay
            displayMatchup();
            
            // Mark as shuffled and disable button
            shuffled = true;
            shuffleBtn.disabled = true;
            shuffleBtn.classList.add('opacity-50');
        }

        // Update the bracket visualization
        function updateBracket() {
            bracket.innerHTML = '';
            
            // Create rounds based on bracket history
            bracketHistory.forEach((roundData, roundIndex) => {
                const roundEl = document.createElement('div');
                roundEl.className = 'round';
                
                const roundTitleEl = document.createElement('div');
                roundTitleEl.className = 'round-title';
                
                // Determine round name
                let roundName;
                const matchupsCount = roundData.matchups.length;
                
                if (matchupsCount >= 32) roundName = "Round of 64";
                else if (matchupsCount >= 16) roundName = "Round of 32";
                else if (matchupsCount >= 8) roundName = "Sweet 16";
                else if (matchupsCount >= 4) roundName = "Elite 8";
                else if (matchupsCount >= 2) roundName = "Final 4";
                else if (matchupsCount === 1) roundName = "Final";
                
                roundTitleEl.textContent = roundName || `Round ${roundData.round}`;
                roundEl.appendChild(roundTitleEl);
                
                // Add matchups
                roundData.matchups.forEach((matchup, matchupIndex) => {
                    const matchupEl = document.createElement('div');
                    matchupEl.className = 'matchup';
                    
                    // Song 1
                    const team1 = document.createElement('div');
                    team1.className = 'team';
                    if (matchup.winner && matchup.winner.id === matchup.song1?.id) {
                        team1.classList.add('winner');
                    }
                    if (eliminatedSongs.some(s => s.id === matchup.song1?.id) || 
                        (matchup.winner && matchup.winner.id !== matchup.song1?.id && matchup.song1)) {
                        team1.classList.add('eliminated');
                    }
                    team1.textContent = matchup.song1?.title || 'Bye';
                    matchupEl.appendChild(team1);
                    
                    // Song 2
                    if (matchup.song2) {
                        const team2 = document.createElement('div');
                        team2.className = 'team';
                        if (matchup.winner && matchup.winner.id === matchup.song2.id) {
                            team2.classList.add('winner');
                        }
                        if (eliminatedSongs.some(s => s.id === matchup.song2.id) || 
                            (matchup.winner && matchup.winner.id !== matchup.song2.id)) {
                            team2.classList.add('eliminated');
                        }
                        team2.textContent = matchup.song2.title;
                        matchupEl.appendChild(team2);
                    }
                    
                    roundEl.appendChild(matchupEl);
                });
                
                bracket.appendChild(roundEl);
            });
            
            // Scroll to current round
            setTimeout(() => {
                const rounds = document.querySelectorAll('.round');
                if (rounds.length > 0) {
                    const currentRoundIndex = Math.min(currentRound - 1, rounds.length - 1);
                    rounds[currentRoundIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 100);
        }

        // Update the bracket highlight
        function updateBracketHighlight() {
            const matchup = matchups[currentMatchup];
            if (!matchup) return;
            
            // Find the corresponding matchup in the bracket
            const matchupsInBracket = document.querySelectorAll('.matchup');
            const currentRoundMatchups = bracketHistory.find(r => r.round === currentRound)?.matchups || [];
            const matchupIndex = currentRoundMatchups.findIndex(m => 
                m.song1?.id === matchup.song1?.id && 
                m.song2?.id === matchup.song2?.id
            );
            
            if (matchupIndex >= 0 && matchupsInBracket[matchupIndex]) {
                const matchupEl = matchupsInBracket[matchupIndex];
                const rect = matchupEl.getBoundingClientRect();
                const containerRect = bracketContainer.getBoundingClientRect();
                
                bracketHighlight.style.width = `${rect.width}px`;
                bracketHighlight.style.height = `${rect.height}px`;
                bracketHighlight.style.left = `${rect.left - containerRect.left}px`;
                bracketHighlight.style.top = `${rect.top - containerRect.top}px`;
                bracketHighlight.style.display = 'block';
            } else {
                bracketHighlight.style.display = 'none';
            }
        }

        // Render the final bracket
        function renderFinalBracket() {
            finalBracket.innerHTML = '';
            
            // Create rounds based on bracket history
            bracketHistory.forEach((roundData) => {
                const roundEl = document.createElement('div');
                roundEl.className = 'round';
                
                const roundTitleEl = document.createElement('div');
                roundTitleEl.className = 'round-title';
                
                // Determine round name
                let roundName;
                const matchupsCount = roundData.matchups.length;
                
                if (matchupsCount >= 32) roundName = "Round of 64";
                else if (matchupsCount >= 16) roundName = "Round of 32";
                else if (matchupsCount >= 8) roundName = "Sweet 16";
                else if (matchupsCount >= 4) roundName = "Elite 8";
                else if (matchupsCount >= 2) roundName = "Final 4";
                else if (matchupsCount === 1) roundName = "Final";
                
                roundTitleEl.textContent = roundName || `Round ${roundData.round}`;
                roundEl.appendChild(roundTitleEl);
                
                // Add matchups
                roundData.matchups.forEach((matchup) => {
                    const matchupEl = document.createElement('div');
                    matchupEl.className = roundData.round === bracketHistory.length ? 'matchup final-matchup' : 'matchup';
                    
                    // Song 1
                    const team1 = document.createElement('div');
                    team1.className = 'team';
                    if (matchup.winner && matchup.winner.id === matchup.song1?.id) {
                        team1.classList.add('winner');
                    }
                    if (eliminatedSongs.some(s => s.id === matchup.song1?.id) || 
                        (matchup.winner && matchup.winner.id !== matchup.song1?.id && matchup.song1)) {
                        team1.classList.add('eliminated');
                    }
                    team1.textContent = matchup.song1?.title || 'Bye';
                    matchupEl.appendChild(team1);
                    
                    // Song 2
                    if (matchup.song2) {
                        const team2 = document.createElement('div');
                        team2.className = 'team';
                        if (matchup.winner && matchup.winner.id === matchup.song2.id) {
                            team2.classList.add('winner');
                        }
                        if (eliminatedSongs.some(s => s.id === matchup.song2.id) || 
                            (matchup.winner && matchup.winner.id !== matchup.song2.id)) {
                            team2.classList.add('eliminated');
                        }
                        team2.textContent = matchup.song2.title;
                        matchupEl.appendChild(team2);
                    }
                    
                    roundEl.appendChild(matchupEl);
                });
                
                finalBracket.appendChild(roundEl);
            });
        }

        // Create confetti effect
        function createConfetti() {
            const colors = ['#1ED760', '#FF0000', '#00FFFF', '#FFFF00', '#FF00FF', '#FFFFFF'];
            
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = `${Math.random() * 10 + 5}px`;
                confetti.style.height = `${Math.random() * 10 + 5}px`;
                confetti.style.animationDuration = `${Math.random() * 3 + 2}s`;
                document.body.appendChild(confetti);
                
                // Remove confetti after animation
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // Utility function to shuffle an array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Event listeners
        nextBtn.addEventListener('click', nextMatchup);
        shuffleBtn.addEventListener('click', shuffleMatchup);
        restartBtn.addEventListener('click', () => {
            // Reset game state
            initGame();
            
            // Reset UI
            gameContainer.classList.remove('hidden');
            winnerContainer.classList.add('hidden');
            winnerCard.classList.remove('pulse');
        });

        // Initialize the game when the page loads
        window.addEventListener('load', () => {
            initGame();
        });
    </script>
</body>
